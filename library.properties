sentence=Board-support package that makes the ESP32-C5 stable and reproducible.
paragraph=Packages the hardware problems already solved on the Waveshare ESP32-C5-Touch-LCD-3.5 (shared-I2C discipline, LC76G GPS over I2C, ST7796 display, FT6336 touch, AXP2101 battery, CH32V006 expander) plus reusable C5 chip-level helpers (single-core task pinning, dual-band band-switch ordering, USB-Serial-JTAG console, 5 GHz channel quirks). A board is only ever claimed supported once it has been run on real hardware.
category=Device Control
