sentence=Board-support package that makes the ESP32-C5 stable and reproducible.
paragraph=Supports the Waveshare ESP32-C5-Touch-LCD-3.5 and 2.8: shared-I2C discipline, display and touch bring-up, CH32V006 expander, LC76G GPS over I2C, ES8311 speaker and microphone, PCF85063 clock, QMI8658 IMU, SHTC3 temperature/humidity sensor and battery readout, plus reusable C5 chip-level helpers (single-core task pinning, dual-band band-switch ordering, USB-Serial-JTAG console, 5 GHz channel quirks). A capability is only claimed once it has run on real hardware.
