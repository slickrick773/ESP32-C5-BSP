; Non-display BSP consumer (compile-tested). Uses the bus + expander + touch +
; GPS + battery drivers; no TFT_eSPI, no display patch. Copy the board/variant/
; partition scaffolding from examples/hello_board first (see ../README.md).
[env:consumer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    ; Pin to a tag or commit. The git+file:// path is your local clone.
    ; The recorded validation used the 0.4.0 candidate commit (see ../CONSUMER-SETUP.md).
    ESP32-C5-BSP=git+file:///path/to/ws-c5-bsp#<commit-or-tag>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
