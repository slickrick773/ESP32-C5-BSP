; Display BSP consumer (compile-tested; NOT hardware-verified by this check).
; Adds the ST7796 via TFT_eSPI + the C5 display patch. Copy the board/variant/
; partition scaffolding AND the patch inputs (apply_c5_tft_patch.py, tft_c5/,
; wsc5_user_setup.h) from examples/hello_board first (see ../README.md).
[env:consumer_display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    ; Pin to a tag or commit. The git+file:// path is your local clone.
    ESP32-C5-BSP=git+file:///path/to/ws-c5-bsp#<commit-or-tag>
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h
    -DARDUINO_USB_CDC_ON_BOOT=1

; Installs the ESP32-C5 processor port into TFT_eSPI after it is downloaded.
extra_scripts = pre:apply_c5_tft_patch.py
