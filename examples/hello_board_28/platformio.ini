; hello_board_28 — Phase 1 bring-up for the Waveshare ESP32-C5-Touch-LCD-2.8.
;
; Standalone on purpose (like examples/hello_board): it carries its own board
; manifest (boards/ws-c5-28.json), variant (variants/ws-c5-28) and partition
; table, so it builds without inheriting any other project's toolchain. That
; independence is the whole point of the BSP.
;
; Display driver: Arduino_GFX (ST7789), reproducing Rick's hardware-accepted
; umbravox 2.8" path, including the MSB-first RAMCTRL byte-order fix. Unlike the
; 3.5" example there is NO TFT_eSPI user-setup and NO C5 processor patch script:
; Arduino_GFX drives the panel through the Arduino SPI class (Arduino_HWSPI),
; which needs no C5-specific library patch.
;
; Console is USB-Serial-JTAG at 115200. If it will not auto-enter download mode:
; hold BOOT, tap RST, release BOOT, then upload.

[env:hello_board_28]
; The C5 needs the pioarduino platform fork (stock espressif32 has no C5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-28
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    ; the BSP itself (this repo root), pulled in by symlink so edits are live
    symlink://../../
    ; Pinned to the exact version the umbravox 2.8" port builds this panel with:
    ; its platformio.ini asks for `^1.5.5`, which resolves forward to 1.6.9 (the
    ; version in its .pio libdeps, incl. its own ws-c5-28 build). 1.5.5 does NOT
    ; compile against this C5 Arduino core (Arduino_ESP32SPIDMA.cpp calls the old
    ; one-arg spiFrequencyToClockDiv); 1.6.9 does. Pinned exact so the proven
    ; ST7789 opcode form in ws_c5_28_display.h cannot drift under the example.
    moononournation/GFX Library for Arduino @ 1.6.9

build_flags =
    ; Route Arduino Serial to the native USB-Serial-JTAG, not UART0/GPIO11.
    ; The board manifest defaults this to 0; 1 puts Serial on the USB port you
    ; flash and monitor on. See docs/HARDWARE-FINDINGS.md.
    -DARDUINO_USB_CDC_ON_BOOT=1
