; Standalone 3.5-inch microSD test. SD and SPI are bundled with the pinned core.
[env:sd_35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200
; Route Arduino Serial to USB-Serial-JTAG (the board manifest defaults this to
; 0). See docs/HARDWARE-FINDINGS.md.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = symlink://../../
