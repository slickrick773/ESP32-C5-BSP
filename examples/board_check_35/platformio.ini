; 3.5-inch whole-board check: every onboard device, one PASS/FAIL table.
[env:board_check_35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200
; Route Arduino Serial to USB-Serial-JTAG. See docs/HARDWARE-FINDINGS.md.
; BOARD_CHECK_35 selects this board in the shared source file.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_CHECK_35=1
lib_deps = symlink://../../
