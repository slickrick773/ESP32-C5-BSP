; reliability_reference — the capstone: Wi-Fi + GPS + touch (+ battery) at once.
;
; The whole point of the BSP in one app: touch, the LC76G GPS and the AXP2101 all
; share one I2C bus while Wi-Fi scans in the background, and touch stays smooth.
; Proves the shared-bus discipline holds under real load.
;
; Carries the display toolchain (TFT_eSPI + the C5 processor patch) like
; hello_board, plus XPowersLib. Console is USB-Serial-JTAG at 115200.

[env:reliability_reference]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../
    bodmer/TFT_eSPI@^2.5.43
    lewisxhe/XPowersLib@^0.3.3

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h
    -DARDUINO_USB_CDC_ON_BOOT=1

extra_scripts = pre:apply_c5_tft_patch.py
