; Standalone 3.5-inch speaker-to-microphone self-test. ESP_I2S is bundled with the pinned core.
[env:audio_selftest_35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200
; Route Arduino Serial to USB-Serial-JTAG so the [audio_selftest_35] diagnostics and
; failure messages reach the port you flash and monitor on (the board manifest
; defaults this to 0). Audio is unaffected. See docs/HARDWARE-FINDINGS.md.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = symlink://../../
