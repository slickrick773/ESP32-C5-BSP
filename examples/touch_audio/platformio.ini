[env:touch_audio]
; The C5 needs the pioarduino platform fork (stock espressif32 has no C5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    ; the BSP itself (this repo root), pulled in by symlink so edits are live
    symlink://../../
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -I$PROJECT_DIR/src/ui/include
    -I$PROJECT_DIR/src/ui/backends
    -DSAMPLE_UI_BSP_STARTUP_API=1
    -DSAMPLE_UI_BSP_CLASSIFIED_TOUCH=1
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h
    ; Route Arduino Serial to the native USB-Serial-JTAG, not UART0/GPIO11.
    ; The board manifest defaults this to 0 (so Serial.print would go to GPIO11
    ; and only ESP-IDF log/panic output would reach USB); 1 puts Serial on the
    ; USB port you flash and monitor on. See docs/HARDWARE-FINDINGS.md.
    -DARDUINO_USB_CDC_ON_BOOT=1

; Installs the ESP32-C5 processor port into TFT_eSPI after it is downloaded.
extra_scripts = pre:apply_c5_tft_patch.py
