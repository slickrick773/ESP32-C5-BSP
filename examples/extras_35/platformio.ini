; 3.5-inch self-checking test: speaker amplifier switch, PWR button, header
; lines E8/E9 and charge current. See README.md.
[env:extras_35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h
    ; Route Arduino Serial to USB-Serial-JTAG. See docs/HARDWARE-FINDINGS.md.
    -DARDUINO_USB_CDC_ON_BOOT=1

; Installs the ESP32-C5 processor port into TFT_eSPI after it is downloaded.
extra_scripts = pre:apply_c5_tft_patch.py
