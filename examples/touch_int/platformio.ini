; touch_int — INT-gated FT6336 touch (optional WsC5_35::Touch::beginInt path).
;
; Proves the gate: with the INT line (TP_INT = GPIO3) saying "no finger", read()
; skips the I2C read and reports no touch -- no stale/phantom points. A finger
; down still tracks. Display-less -- serial only.
;
; Console is USB-Serial-JTAG at 115200.

[env:touch_int]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
