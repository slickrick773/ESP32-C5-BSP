; exio_probe — startup expander READ-ONLY diagnostic (not a shipped BSP example).
; Reuses hello_board's board manifest / variant / partition table so it builds
; standalone. It writes NO expander registers and touches no power/reset/PWM
; output; it only reads, to learn the CH32V006's register readability and resting
; state at startup. Flash ONLY the app at 0x10000 (c5flash) — do not pio-upload,
; which would overwrite the bootloader at 0x2000.
[platformio]
boards_dir = ../hello_board/boards

[env:exio_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = ../hello_board/variants
board_build.partitions = ../hello_board/partitions_ota_16mb.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
