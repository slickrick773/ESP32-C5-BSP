; hello_board — Phase 1 bring-up for the Waveshare ESP32-C5-Touch-LCD-3.5.
;
; Standalone on purpose: this example carries its own board manifest
; (boards/ws-c5-35.json), variant (variants/ws-c5-35), partition table, TFT_eSPI
; user setup and the ESP32-C5 processor patch, so it builds without inheriting
; any other project's toolchain. That independence is the whole point of the
; BSP -- it is the fix for the shared-toolchain clashes C5 ports keep hitting.
;
; Console is USB-Serial-JTAG at 115200. If it will not auto-enter download mode:
; hold BOOT, tap RST, release BOOT, then upload.

[env:hello_board]
; The C5 needs the pioarduino platform fork (stock espressif32 has no C5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    ; the BSP itself (this repo root), pulled in by symlink so edits are live
    symlink://../../
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h

; Installs the ESP32-C5 processor port into TFT_eSPI after it is downloaded.
extra_scripts = pre:apply_c5_tft_patch.py
