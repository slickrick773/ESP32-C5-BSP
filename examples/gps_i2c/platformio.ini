; gps_i2c — Phase 3: LC76G GNSS over I2C on the shared bus.
;
; Display-less on purpose: GPS needs only the I2C bus, so this example pulls in
; neither TFT_eSPI nor the C5 display patch. It opens the bus through the BSP's
; shared-I2C core and runs the LC76G module, printing fix + satellite count over
; the USB console. Wire the LC76G to SDA 27 / SCL 26 / 3V3 / GND (see
; docs/BOARD-WS-C5-35.md).
;
; Console is USB-Serial-JTAG at 115200.

[env:gps_i2c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../
    ; The BSP bundles ws_c5_35_battery.cpp (XPowersLib); the whole library is
    ; compiled when any board/ws_c5_35 header is included, so the dep is needed
    ; even though this GPS example doesn't use the battery.
    lewisxhe/XPowersLib@^0.3.3

build_flags =
    ; Arduino Serial on the native USB-Serial-JTAG (not UART0/GPIO11).
    -DARDUINO_USB_CDC_ON_BOOT=1
