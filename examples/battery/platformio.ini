; battery — Phase 4: AXP2101 PMU / battery readout over the shared I2C bus.
;
; Reads the AXP2101 (0x34) via XPowersLib: USB/charge state always, plus
; percentage and cell voltage when a LiPo is on the MX1.25 header. Also scans
; the bus at boot so you can confirm the onboard chips (and a wired GPS at
; 0x50) are present. Display-less -- serial only.
;
; Console is USB-Serial-JTAG at 115200.

[env:battery]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
