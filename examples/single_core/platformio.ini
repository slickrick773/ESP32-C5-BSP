; single_core — Phase 5: chip-level single-core task-pinning helper.
;
; Proves the C5 is unicore and that createPinnedTask() lands a task on the only
; core (core 0), where a hard-coded "core 1" would be silently ignored. No
; display, no battery -- serial only.
;
; Console is USB-Serial-JTAG at 115200.

[env:single_core]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200

lib_deps =
    symlink://../../
    ; This example uses no battery, but pulling in the BSP compiles the whole
    ; library -- including ws_c5_35_battery.cpp -- so XPowersLib is still needed.
    lewisxhe/XPowersLib@^0.3.3

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
